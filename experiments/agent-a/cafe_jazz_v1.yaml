# 咖啡馆爵士 BGM：钢琴三重奏（钢琴和弦 + 低音提琴走低音 + 刷子鼓），约 45 秒，可循环
# 第 30 秒进入高潮段，加入旋律。结尾两小节是 ii-V 回到开头的 Fmaj7，便于无缝循环。
title: cafe_jazz
meta:
  bpm: auto
  length: "0:45"
  swing: 0.62
  swing_unit: 8
  loop: true
  key: F

sections:
  - name: intro
    bars: 4
    energy: 0.35
  - name: verse
    bars: 8
    energy: "0.45->0.55"
  - name: build
    bars: 4
    energy: "0.55->0.75"
  - name: climax
    bars: 6
    energy: 0.9
    at: "0:30"
  - name: tail
    bars: 2
    energy: "0.6->0.4"

harmony:
  intro:  "Fmaj7 | Dm7 | Gm7 | C7"
  verse:  "Fmaj7 | D7 | Gm7 | C7 | Am7 | D7 | Gm7 | C7"
  build:  "Bbmaj7 | Bbm7 Eb7 | Am7 D7 | Gm7 C7"
  climax: "Fmaj7 | D7 | Gm7 | C7 | Am7 D7 | Gm7 C7"
  tail:   "Fmaj7 D7 | Gm7 C7"

tracks:
  piano:
    sound: piano
    texture: comp
    in: [intro, verse, build, climax, tail]
    rhythm: "X..x.... | ..x..x.."
    by_section:
      climax: {rhythm: "X..x..x. | .x..X..x"}

  bass:
    sound: contrabass
    texture: bassline
    in: [intro, verse, build, climax, tail]
    rhythm: "1-3-5-7- | 8-5-3-5-"

  drums:
    sound: drums-brush
    texture: groove
    in: [intro, verse, build, climax, tail]
    pattern:
      kick:      "g....... | ....g..."
      snare:     "g.x.g.x. | g.x.g.xg"
      pedal-hat: "..x...x. | ..x...x."
      ride:      "x.xxx.xx | x.xxx.xx"
    by_section:
      intro:
        pattern:
          snare:     "g.g.g.g. | g.g.g.g."
          pedal-hat: "..x...x. | ..x...x."
      climax:
        pattern:
          kick:      "x......x | ....x..."
          snare:     "g.X.g.Xg | g.X.gxXg"
          pedal-hat: "..x...x. | ..x...x."
          ride:      "X.xxX.xx | X.xxX.xx"

  cymbal:
    sound: drums-brush
    texture: crash
    in: [climax]

  melody:
    sound: piano
    texture: melody
    in: [climax, tail]
    notes:
      climax: >-
        r/8 A4/8 C5/8 E5/8 G5/4. F5/8 |
        F#5/4 E5/8 D5/8 C5/4 A4/4 |
        Bb4/8 D5/8 F5/8 A5/8 G5/2 |
        r/8 E5/8 G5/8 Bb5/8 A5/4 G5/4 |
        C5/8 E5/8 G5/8 E5/8 F#5/8 A5/8 C6/4 |
        Bb5/4 A5/8 G5/8 E5/2
      tail: "F5/2. r/4 | r/1"
