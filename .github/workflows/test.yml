name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      ONBGM_SOUNDS: ${{ github.workspace }}/sounds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装 FluidSynth
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fluidsynth
      - name: 安装 onbgm
        run: pip install -e '.[dev]'
      # 只下载 GM 音源（31MB）：需要高质量采样的测试会自动跳过，完整音源约 1.2GB，不适合每次 CI 都下载
      - uses: actions/cache@v4
        with:
          path: sounds/GeneralUser-GS.sf2
          key: generaluser-${{ hashFiles('onbgm/fetch.py') }}
      - name: 下载 GM 音源
        run: python -c "from pathlib import Path; from onbgm.fetch import fetch_generaluser; fetch_generaluser(Path('sounds'))"
      - name: 诊断（临时）
        run: |
          grep -m1 "model name" /proc/cpuinfo; grep -o -w -E "avx2|avx512f|avx512bw|avx512vl|avx512_vnni|avx_vnni|sha_ni|vaes" /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          for m in soundfile soxr pyloudnorm matplotlib mido jsonschema pedalboard; do python -X faulthandler -c "import $m; print('ok', '$m')" || echo "FAIL $m"; done
          python -X faulthandler -c "import onbgm.cli; print('ok onbgm.cli')" || echo "FAIL onbgm.cli"
          python -X faulthandler -m onbgm.cli doctor || echo "FAIL doctor $?"
      - name: onbgm doctor
        run: onbgm doctor
      - name: 测试
        run: pytest -q
