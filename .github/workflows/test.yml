name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      ONBGM_SOUNDS: ${{ github.workspace }}/sounds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装 FluidSynth
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fluidsynth
      - name: 安装 onbgm
        run: pip install -e '.[dev]'
      # 只下载 GM 音源（31MB）：需要高质量采样的测试会自动跳过，完整音源约 1.2GB，不适合每次 CI 都下载
      - uses: actions/cache@v4
        with:
          path: sounds/GeneralUser-GS.sf2
          key: generaluser-${{ hashFiles('onbgm/fetch.py') }}
      - name: 下载 GM 音源
        run: python -c "from pathlib import Path; from onbgm.fetch import fetch_generaluser; fetch_generaluser(Path('sounds'))"
      # pedalboard 的 Linux 预编译包按打包机器的 CPU 编译（上游已修复，等 0.9.26 发布），
      # 分到不同型号的 CPU 时一导入就崩溃（Illegal instruction）。遇到时从源码编译一份通用版本
      - name: 检查 pedalboard
        run: |
          if [ "${FORCE_PEDALBOARD_BUILD:-}" = 1 ] || ! python -c "import pedalboard" 2>/dev/null; then
            echo "预编译的 pedalboard 在这台机器的 CPU 上不能用，从源码编译"
            # PyPI 上只有预编译包，没有源码包：用上游修复了这个问题的提交编译（子模块用 SSH 地址，改走 HTTPS）
            git config --global url."https://github.com/".insteadOf git@github.com:
            time USE_PORTABLE_SIMD=1 pip install --force-reinstall --no-deps "pedalboard @ git+https://github.com/spotify/pedalboard@8dd91c687ae96995ba90f4f928e3baa5e047fe96"
          fi
          python -c "import pedalboard; print('pedalboard', pedalboard.__version__)"
        env:
          FORCE_PEDALBOARD_BUILD: 1  # 临时：验证源码编译能成功
      - name: onbgm doctor
        run: onbgm doctor
      - name: 测试
        run: pytest -q
