# 推送 v* 标签时构建并发布到 PyPI。用 PyPI 的受信任发布（Trusted Publishing），不需要 API token：
# PyPI 上登记的发布者是 anelikes/onbgm 仓库的 publish.yml 工作流。
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 和 pyproject.toml 的版本 $version 不一致"; exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # 受信任发布要用 GitHub 的 OIDC 身份
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
