[project]
name = "onbgm"
version = "0.1.1"
description = "Instrumental background music written note by note by AI agents: a text score in, a mixed and mastered track out"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "anelikes", email = "contact@onbgm.com" }]
readme = "README.md"
keywords = ["bgm", "music", "ai-agents", "llm", "midi", "sfz", "soundtrack", "music-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
    "mido",
    "pyyaml",
    "numpy",
    "soundfile",
    "pedalboard",
    "pyloudnorm",
    "matplotlib",
    "soxr",
    "jsonschema",
]

[project.urls]
Homepage = "https://onbgm.com"
Repository = "https://github.com/anelikes/onbgm"
Issues = "https://github.com/anelikes/onbgm/issues"
Changelog = "https://github.com/anelikes/onbgm/releases"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
onbgm = "onbgm.entry:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["onbgm"]

[tool.setuptools.package-data]
onbgm = ["examples/*.yaml", "catalog.yaml", "player.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
