# 跳岛快船 —— Eb 大调，106 BPM，26 小节无缝循环，wave（两轮起伏）
# 风格：卡利普索（calypso）。底鼓踩 1、2 拍后半、3、4 拍后半，沙锤十六分音符铺满，吉他"咚—嚓"切音扫弦，
#   贝斯走 3+3+2 的切分；口哨只在乐句结尾答一句。
# 核心动机（马林巴）：G–Bb 在第一拍后十六分音符上抢拍、再跳上 Eb 的长音，像小船一下下跃过浪头；
#   每两小节按和弦往上或往下模进，b 段整句提高八度、换成副属和弦（G7、Eb7、C7）让画面更亮。
# 和声：a 段 I–IV–V7–I 的卡利普索终止，第二句从 vi 进入；dip 段 IV–I6–ii–V；
#   b 段 I–III7–vi–I7–IV–V7–I VI7–ii V7，一连串副属和弦把明亮推到顶点。
# 能量：intro 0.45 → a 0.75 → dip 0.4（只剩吉他、贝斯和鼓边）→ b 0.92（弦乐、颤音琴、吊镲）→ down 0.45 接回开头。
title: Island Hopper
meta:
  bpm: 106
  key: Eb major
  loop: true
  seed: 661094

sections:
  - { name: intro, bars: 2, energy: 0.45 }
  - { name: a,     bars: 8, energy: 0.75 }
  - { name: dip,   bars: 4, energy: 0.4 }
  - { name: b,     bars: 8, energy: 0.92 }
  - { name: down,  bars: 4, energy: 0.45 }

harmony:
