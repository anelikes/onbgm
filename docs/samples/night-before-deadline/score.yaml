# 截止前夜 —— head-nod boom-bap，C 大调，90 BPM，可循环，能量走向 wave（多次起伏）
# 构思：这首更"硬"一点。贝斯钩子是一条推着走的八分音符 riff：根音连敲（DUM-da）→ 五音 → 根音，
# 后半小节用半音往上爬（Bb-B-C、F#-G-Ab）顶进下一个和弦；A 段是 I–bVI（Cmaj9 Abmaj9），借来的 bVI 让大调带点阴影。
# B 段 IV–iii–VI7–ii–V，第二遍结尾用 Db9 三全音替代滑回 C；钢琴主奏用"小三度来回弹"（A–C–A–C~）的动机，
# 三处 B 段越弹越高，b3 翻到高八度是全曲顶点。c 段换成 vi–vi/5–IV#11–III7#9–vi–II9–iv–V，鼓改半速，钢琴唱长句。
# 走向：a1 → b1 起 → brk 只剩贝斯、踩镲、边击 → b2 → a2 回落 → c 换色 → b3 最满 → a3 收回，接回开头。
