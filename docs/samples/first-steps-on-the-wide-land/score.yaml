# 初踏大地 —— D 大调，102 BPM，52 小节（约 122 秒）无缝循环，两次高潮（第二次更强）
# 核心动机：小提琴"四分—（休止）—八分上行—四分"的号角式呼喊（D-A-D-E-F#），下一小节落在长音上，
#   第三小节在属和弦上原样模进一级（E-C#-E-F#-G），像一步一步走上山坡。
# 和声：开头四小节踩着主音 D 的持续低音（I–IV/I–V/I–I），再走 vi–IV–V/V（E7/G#）–V，有"出发"的开阔感；
#   shadow 段转到关系小调 B 小调，后半低音 B-A-G-F# 级进下行；rise 段低音半音上行 G-A#-B-C#-D 推进高潮。
# 曲式：intro（定音鼓+军鼓预备）→ theme（小提琴中音区陈述）→ theme2（第一次高潮：圆号加厚句尾、大提琴对位、军鼓进行曲）
#   → shadow（B 小调，大提琴接过旋律，小提琴高处长音）→ rise（动机模进爬升 + 军鼓滚奏）
#   → anthem（第二次高潮：小提琴高八度全奏，铜管句尾强奏）→ homeward（动机碎片回落，A7 接回开头）。
title: First Steps on the Wide Land
meta:
  bpm: 102
  key: D major
  loop: true
  seed: 561172

sections:
  - { name: intro,    bars: 4,  energy: 0.35 }
  - { name: theme,    bars: 8,  energy: 0.55 }
  - { name: theme2,   bars: 8,  energy: 0.78 }
  - { name: shadow,   bars: 8,  energy: 0.45 }
  - { name: rise,     bars: 4,  energy: "0.55->0.85" }
  - { name: anthem,   bars: 12, energy: 1.0 }
  - { name: homeward, bars: 8,  energy: "0.55->0.4" }

harmony:
  intro:    "D | G/D | D | Asus4 A"
  theme:    "D | G/D | A/D | D | Bm | G | E7/G# | Asus4 A"
  theme2:   "D | G/D | A/D | Bm | G | D/F# | Em7 A7 | D"
  shadow:   "Bm | Gmaj7 | Em7 | F#7 | Bm | Bm/A | Gmaj7 | F#7"
  rise:     "G | A/G | F#7/A# | Bm A/C#"
  anthem:   "D | G/D | A/D | D | Bm | G | E7/G# | Asus4 A | Bm | G | Em7 | Asus4 A7"
  homeward: "D | G/D | D | A/C# | Bm | G | Em7 | Asus4 A7"

tracks:
