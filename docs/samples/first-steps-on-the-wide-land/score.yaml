        B3/4 D4/4 F#4/4 D4/4 | G3/4 B3/4 D4/4 G4/4 | G#3/4 B3/4 D4/4 E4/4 | D4/2 C#4/2 |
        D4/2 F#4/2 | G4/2 B3/2 | E4/2 G4/2 | A3/2 C#4/2

