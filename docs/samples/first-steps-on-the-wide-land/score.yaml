    texture: melody
    notes:
      theme: >
        D5/4 r/8 A4/8 D5/8 E5/8 F#5/4 | G5/2 B5/4 A5/8 G5/8 |
        E5/4 r/8 C#5/8 E5/8 F#5/8 G5/4 | F#5/2. r/4 |
        D5/4 r/8 B4/8 D5/8 F#5/8 B5/4 | B5/4. A5/8 G5/4 D5/4 |
        E5/4. F#5/8 G#5/4 B5/4 | A5/2 G5/4 E5/4
      theme2: >
        F#5/4 r/8 D5/8 F#5/8 G5/8 A5/4 | B5/2 A5/4 G5/4 |
        A5/4 r/8 E5/8 A5/8 G5/8 E5/4 | F#5/2 D5/4 B4/4 |
        G4/4 r/8 B4/8 D5/8 G5/8 B5/4 | A5/4. G5/8 F#5/4 D5/4 |
        G5/4 F#5/8 E5/8 A4/4 C#5/4 | D5/2. r/4
      rise: >
