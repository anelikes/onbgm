        F#5/4 r/8 C#5/8 F#5/8 A#5/8 C#6/4 | B5/2 A5/4 C#6/4
      anthem: >
        D6/4 r/8 A5/8 D6/8 E6/8 F#6/4 | G6/2 B6/4 A6/8 G6/8 |
        E6/4 r/8 C#6/8 E6/8 F#6/8 G6/4 | F#6/2. r/4 |
        D6/4 r/8 B5/8 D6/8 F#6/8 B6/4 | B6/4. A6/8 G6/4 D6/4 |
        E6/4. F#6/8 G#6/4 B6/4 | A6/2 G6/4 E6/4 |
        F#6/4. E6/8 D6/4 B5/4 | G6/4. F#6/8 E6/4 D6/4 |
        E6/4. F#6/8 G6/4 B6/4 | A6/2. r/4
      homeward: >
        D5/4 r/8 A4/8 D5/8 E5/8 F#5/4 | G5/2. r/4 |
        F#5/4 r/8 D5/8 F#5/8 E5/8 D5/4 | E5/2. r/4 |
        D5/4 r/8 B4/8 D5/8 C#5/8 B4/4 | D5/2 B4/4 G4/4 |
        B4/4. E5/8 D5/2 | D5/2 C#5/2

  # B 小调段：大提琴接过旋律
  cello_tune:
