# 摇下车窗吹口哨 —— 口哨主奏的欢快公路民谣，Ab 大调，107 BPM，多次起伏（wave）
# 构思：开头的吉他和弦是带混合利底亚色彩的 I–bVII–IV–I（Ab | Gb | Db | Ab），像摇下车窗时的那股得意劲。
# 口哨动机是"两个八分音符跳上去 + 四分音符 + 回落"的哼唱句（Eb–Ab–C–Bb–Ab–Eb），第三小节在 IV 上整句模进。
# 副歌换成 IV–I/3–ii–V（Db | Ab/C | Bbm7 | Eb），口哨改成"四分、四分、附点四分"的大合唱式长句，钟琴高八度跟唱。
# 能量三起三落：副歌之后各接一个收窄的间奏（只剩吉他、边击和口哨碎片），
# 第二个间奏是半速的 iii–vi–ii–V（Cm7 | Fm7 | Bbm7 | Eb），把最后一遍副歌托到全曲最高点，
# 结尾用混合利底亚的 bVII–I（Gb | Ab）收住。
