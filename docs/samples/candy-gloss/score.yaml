# 明亮未来浩室 · Eb 大调 125 BPM · 46 小节约 90 秒 · 不循环 · 能量平稳（plateau）
# 构思："糖果色"——超级锯齿唱一个能跟着喊的长音钩子："短-短-长、停、短短短"，和声用卡农式的下行低音
# （I–V6–vi–iii–IV–I6–ii–V），旋律逆着低音往上走；主歌换合成拨弦弹十六分音符的"跳跳"短句，和声换成 vi–ii–V–I 五度圈；
# 去掉底鼓的小桥段由合成钟慢慢唱；桥段走 iii–VI7–ii–V（E 还原音带来一点俏皮的副属和弦颜色），最后一遍钩子收在主和弦上。
