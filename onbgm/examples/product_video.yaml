# 产品宣传片 —— 45 秒、不循环、0:08 产品出现时"打开"、0:30 收尾停在 logo；全部合成器音色
# 音符由一个只读过 skill 的全新 agent 编写（2026-10-01 第三轮测试），音色后来换成合成器
# 产品宣传片 BGM v2 —— 只加强 0:08 的冲击（改动限于第 4 小节 0:06–0:08 与第 5 小节 0:08–0:10）
# 0:00 开场空镜（克制、期待） → 0:08 产品出现（打开） → 0:30 logo（终止式落在主和弦） → 0:45 结束
title: Product Launch
meta:
  bpm: auto
  length: "0:44"        # 乐谱 44 秒 + tail 1 秒 = 输出 45 秒
  tail: 1
  key: D major
  seed: 0

# 120 BPM 下 1 小节 = 2 秒
sections:
  - { name: intro,  bars: 4, energy: "0.2->0.45" }            # 0:00–0:08
  - { name: drop,   bars: 4, energy: 0.85, at: "0:08" }       # 0:08–0:16 产品出现
  - { name: drive,  bars: 4, energy: 0.9 }                    # 0:16–0:24
  - { name: lift,   bars: 3, energy: "0.9->1.0" }             # 0:24–0:30 ii–IV–V 引向主和弦
  - { name: ending, bars: 1, energy: 1.0, at: "0:30" }        # 0:30 最后一击
  - { name: logo,   bars: 6, energy: "0.35->0.05" }           # 0:32–0:44 主和弦长音托住 logo

harmony:
  intro:  "Bm7 | Gmaj7 | Em7 | Asus4 A"
  drop:   "D | A/C# | Bm7 | G"
  drive:  "D | A/C# | Bm7 | G"
  lift:   "Em7 | G | Asus4 A"
  ending: "D"
  logo:   "D"

tracks:
  pad:
    sound: synth-pad
    texture: pad
    in: all

  arp:
