        B3/8 F#4/8 A4/8 D5/8 F#5/8 D5/8 A4/8 F#4/8 |
        G3/8 D4/8 F#4/8 B4/8 D5/8 B4/8 F#4/8 D4/8 |
        E4/8 B4/8 D5/8 G5/8 B5/8 G5/8 D5/8 B4/8 |
        A3/8 E4/8 A4/8 D5/8 A4/16 C#5/16 E5/16 A5/16 C#6/16 E6/16 A6/16 r/16
      drop: >-
        D5/16 A4/16 F#5/16 D5/16 A4/16 F#5/16 D5/16 A4/16 F#5/16 D5/16 A4/16 F#5/16 D5/16 A4/16 F#5/16 D5/16 |
        C#5/16 A4/16 E5/16 C#5/16 A4/16 E5/16 C#5/16 A4/16 E5/16 C#5/16 A4/16 E5/16 C#5/16 A4/16 E5/16 C#5/16 |
        D5/16 B4/16 F#5/16 D5/16 B4/16 F#5/16 D5/16 B4/16 F#5/16 D5/16 B4/16 F#5/16 D5/16 B4/16 F#5/16 D5/16 |
        D5/16 B4/16 G5/16 D5/16 B4/16 G5/16 D5/16 B4/16 G5/16 D5/16 B4/16 G5/16 D5/16 B4/16 G5/16 D5/16
      drive: >-
        D5/16 A4/16 F#5/16 D5/16 A4/16 F#5/16 D5/16 A4/16 F#5/16 D5/16 A4/16 F#5/16 D5/16 A4/16 F#5/16 D5/16 |
        C#5/16 A4/16 E5/16 C#5/16 A4/16 E5/16 C#5/16 A4/16 E5/16 C#5/16 A4/16 E5/16 C#5/16 A4/16 E5/16 C#5/16 |
        D5/16 B4/16 F#5/16 D5/16 B4/16 F#5/16 D5/16 B4/16 F#5/16 D5/16 B4/16 F#5/16 D5/16 B4/16 F#5/16 D5/16 |
        D5/16 B4/16 G5/16 D5/16 B4/16 G5/16 D5/16 B4/16 G5/16 D5/16 B4/16 G5/16 D5/16 B4/16 G5/16 D5/16
      lift: >-
        E5/16 B4/16 G5/16 E5/16 B4/16 G5/16 E5/16 B4/16 G5/16 E5/16 B4/16 G5/16 E5/16 B4/16 G5/16 E5/16 |
        D5/16 B4/16 G5/16 D5/16 B4/16 G5/16 D5/16 B4/16 G5/16 D5/16 B4/16 G5/16 D5/16 B4/16 G5/16 D5/16 |
        D5/16 A4/16 E5/16 D5/16 A4/16 E5/16 D5/16 A4/16 C#5/16 A4/16 E5/16 C#5/16 A4/16 E5/16 C#5/16 A4/16
      ending: "D5/1"

  lead:
    sound: synth-bell
    texture: melody
    in: [drop, drive, lift, ending]
    notes:
      drop: >-
        F#6/8> A6/8 r/8 A6/8 B6/8 A6/8 F#6/4 |
        E6/8 E6/8 r/8 E6/8 F#6/8 E6/8 C#6/4 |
        D6/8 F#6/8 r/8 F#6/8 A6/8 F#6/8 D6/4 |
        G6/4. F#6/8 D6/4 r/4
      drive: >-
        F#6/8 A6/8 r/8 A6/8 B6/8 A6/8 D7/4 |
        C#7/8 B6/8 r/8 A6/8 B6/8 A6/8 E6/4 |
        D7/8 C#7/8 r/8 B6/8 A6/8 F#6/8 B6/4 |
        G6/4. A6/8 B6/4 r/4
      lift: >-
        G6/8 B6/8 r/8 B6/8 D7/8 B6/8 G6/4 |
        B6/8 D7/8 r/8 D7/8 E7/8 D7/8 B6/4 |
        A6/8 B6/8 D7/8 E7/8 E7/4 C#7/4
      ending: "D7/1>"

  bass:
    sound: synth-bass
    texture: bassline
    in: [drop, drive, lift, ending]
    rhythm: "1.1. 1.1. 1.1. 1.8."
    by_section:
      ending: {rhythm: "1--- ---- ---- ----"}

  sub:
    sound: sub-bass
    texture: bass-sustain
    in: [logo]

  hit:
    sound: supersaw
    texture: comp
    in: [drop, ending]
    rhythm: "X--- ---- ---- ----"
    by_section:
      drop: {rhythm: "X--- ---- ---- ---- | .... .... .... .... | .... .... .... .... | .... .... .... ...."}

  boom:
    sound: bass-808
    texture: line
    in: [intro, drop]
    notes:
      intro: "r/1 | r/1 | r/1 | r/2 A2/16 A2/16 A2/16 A2/16 A2/16 A2/16> A2/16> r/16"
      drop:  "D2/1> | r/1 | r/1 | r/1"

  drums:
    sound: drums-synth
    texture: groove
    in: [intro, drop, drive, lift, ending]
    pattern:
      kick:     "x... x... x... x..."
      clap:     ".... x... .... x..."
      hat:      "xg.g xg.g xg.g xg.g"
      open-hat: "..x. ..x. ..x. ..x."
      snare:    ".... .... .... ...."
      crash:    ".... .... .... ...."
    by_section:
      intro:
        pattern:
          kick:     ".... .... .... .... | .... .... .... .... | .... .... .... .... | .... .... .... ...."
          clap:     ".... .... .... .... | .... .... .... .... | .... .... .... .... | .... .... .... ...."
          hat:      ".... .... .... .... | .... .... .... .... | g.g. g.g. g.g. g.g. | g.g. g.g. xxxx ...."
          open-hat: ".... .... .... .... | .... .... .... .... | .... .... .... .... | .... .... .... ...."
          snare:    ".... .... .... .... | .... .... .... .... | .... .... .... .... | g.g. x.x. xxxx ...."
          tom-high: ".... .... .... .... | .... .... .... .... | .... .... .... .... | .... .... .... X..."
          tom-mid:  ".... .... .... .... | .... .... .... .... | .... .... .... .... | .... .... .... .X.."
          tom-low:  ".... .... .... .... | .... .... .... .... | .... .... .... .... | .... .... .... ..X."
          crash:    ".... .... .... .... | .... .... .... .... | .... .... .... .... | .... .... .... ...."
      drop:
        pattern:
          kick:     "X... x... x... x..."
          clap:     "X... x... .... x... | .... x... .... x... | .... x... .... x... | .... x... .... x..."
          hat:      "xg.g xg.g xg.g xg.g"
          open-hat: "..x. ..x. ..x. ..x."
          snare:    ".... .... .... ...."
          crash:    "X... .... .... .... | .... .... .... .... | .... .... .... .... | .... .... .... ...."
      lift:
        pattern:
          kick:     "x... x... x... x... | x... x... x... x... | x... x... x... ...."
          clap:     ".... x... .... x... | .... x... .... x... | .... x... .... ...."
          hat:      "xg.g xg.g xg.g xg.g | xg.g xg.g xg.g xg.g | xxxx xxxx xxxx ...."
          open-hat: "..x. ..x. ..x. ..x. | ..x. ..x. ..x. ..x. | .... .... .... ...."
          snare:    ".... .... .... .... | .... .... .... .... | x.x. x.x. xxxx XXXX"
          crash:    ".... .... .... .... | .... .... .... .... | .... .... .... ...."
      ending:
        pattern:
          kick:     "X... .... .... ...."
          clap:     "X... .... .... ...."
          hat:      ".... .... .... ...."
          open-hat: ".... .... .... ...."
          snare:    ".... .... .... ...."
          crash:    "X... .... .... ...."

# 音效时间线：和音乐共用一个时钟（音乐部分一个音没改）
sfx:
  - { type: riser, at: drop, length: 8 }            # 0:04–0:08 往上冲，在产品出现的一刻戛然而止
  - { type: impact, at: drop, duck: 4 }             # 0:08 产品出现：冲击，同时把音乐压低 4 dB
  - { type: sub-drop, at: drop, level: 0.7 }        # 下坠低音托底，自动从当时和弦的根音往下滑
  - { type: whoosh, at: drive }                     # 0:16 镜头切换
  - { type: reverse-cymbal, at: ending, length: 4 } # 0:28–0:30 推进到收尾
  - { type: impact, at: ending, level: 0.6 }        # 0:30 切到 logo
  - { type: downlifter, at: logo, length: 8, level: 0.5 }
  - { type: ding, at: logo, level: 0.5 }            # logo 出现的提示音，和当时的和弦同调
