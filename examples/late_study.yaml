# 深夜自习 —— lo-fi hip hop
# 节奏型写法：每小节 16 个字符，一个字符是一个十六分音符（空格只为好读）。
title: Late Study
meta:
  bpm: 78
  key: C major
  loop: true
  seed: 3
  swing: 0.58         # 十六分音符摇摆，lo-fi 的"晃"感

fx:
  lofi: 0.7           # 磁带抖动 + 低通 + 黑胶底噪

sections:
  - { name: intro, bars: 4, energy: 0.3 }
  - { name: a,     bars: 8, energy: 0.6 }
  - { name: b,     bars: 8, energy: 0.75 }
  - { name: outro, bars: 4, energy: "0.45->0.3" }

harmony:
  intro: "Dm9 | G13 | Cmaj9 | A7b9"
  a:     "Dm9 | G13 | Cmaj9 | A7b9"
  b:     "Fmaj9 | Em7 A7b9 | Dm9 | G13 | Fmaj9 | Em7 A7b9 | Dm9 G13 | Cmaj9 A7b9"
  outro: "Dm9 | G13 | Cmaj9 | A7b9"

tracks:
  keys:               # 电钢琴和弦：第一拍弹，第二拍后半拍提前切入
    sound: epiano
    texture: comp
    roll: 0.02
    rhythm: "x--- --x- ---- ----"
    by_section:
      intro: { rhythm: "x--- ---- ---- ----" }

  bass:
    sound: electric-bass
    texture: bassline
    in: [a, b, outro]
    rhythm: "1--- ---1 --5- ----"     # 跟着底鼓走

  drums:
    sound: drums-jazz
    texture: groove
    in: [a, b, outro]
    laid_back: 0.03                    # 军鼓往后拖一点
    pattern:
      kick:  "x... ...x ..x. ...."
      snare: ".... x..g .... x..."
      hat:   "x.xg x.x. x.xg x.xg"
    by_section:
      b:
        pattern:
          kick:  "x... ...x ..x. ..x."
          snare: ".... x..g .... x..g"
          hat:   "x.xg x.x. x.xg x.xg"
      outro:
        pattern:
          rim:   ".... x... .... x..."
          hat:   "x.x. x.x. x.x. x.x."

  vibes:              # 颤音琴旋律，摇摆由引擎统一加上
    sound: vibraphone
    texture: melody
    notes:
      a: >
        r/8 A4/8 C5/8 E5/8 D5/4. C5/8 | B4/4 r/8 A4/8 G4/8 E4/8 F4/4 |
        E4/2 r/8 G4/8 B4/8 D5/8 | C#5/4. Bb4/8 A4/4 G4/4 |
        D5/8 E5/8 F5/8 A5/8 G5/4 F5/8 E5/8 | F5/4. E5/8 D5/4 B4/4 |
        C5/8 D5/8 E5/8 G5/8 B4/2 | A4/4 r/4 r/2
      b: >
        E5/4. C5/8 A4/2 | G4/8 B4/8 D5/8 E5/8 C#5/4 Bb4/4 | A4/2. r/4 | r/8 B4/8 D5/8 F5/8 E5/2 |
        E5/4. G5/8 A5/2 | G5/8 E5/8 D5/8 B4/8 C#5/4 E5/4 | F5/4 E5/8 D5/8 B4/4 A4/4 | G4/2 r/2
